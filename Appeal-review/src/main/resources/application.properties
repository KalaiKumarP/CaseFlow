# ================================================================
# SERVER CONFIGURATION
# ================================================================
server.port=8082
spring.application.name=caseflow-appeals

# ================================================================
# MYSQL DATABASE CONFIGURATION
# ================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/caseflow_appeals_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=KalaiKumar@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=CaseflowAppealsPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ================================================================
# JPA / HIBERNATE CONFIGURATION
# ================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================================================
# FEIGN ? DISABLED DURING STANDALONE TESTING
# Real URLs will be restored when modules 4.1 and 4.2 are ready.
# ================================================================
# case.service.url=http://localhost:8081
# user.service.url=http://localhost:8080
spring.cloud.openfeign.circuitbreaker.enabled=false

# ================================================================
# SWAGGER / OPENAPI
# ================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.example.Appeal_review.controller

# ================================================================
# LOGGING
# ================================================================
logging.level.com.caseflow=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ================================================================
# ACTUATOR
# ================================================================
management.endpoints.web.exposure.include=health,info